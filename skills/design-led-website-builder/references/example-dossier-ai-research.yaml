schema_version: "1.0"
fixture: true
request: "We built an AI analysis tool for research teams. We want a premium, credible site that does not look like a template. I cannot name a style. Need product demo, features, cases, and pricing."

brief:
  scenario: "AI research SaaS marketing site"
  audience: "Research leads and analysts comparing an unfamiliar product with established workflows."
  primary_action: "Inspect a truthful product demonstration, then request an evaluation workspace."
  belief_change: "From 'another vague AI wrapper' to 'a precise research instrument whose evidence I can inspect.'"
  content_inventory:
    - "Draft product positioning"
    - "Feature outline"
    - "Provisional plan structure"
  content_gaps:
    - "No approved customer names, metrics, testimonials, or case-study evidence"
    - "No final product capture or motion assets"
    - "No confirmed pricing values"
  desired_emotion: "Calm technical confidence, intellectual clarity, and controlled curiosity."
  anti_direction: "No generic neon future, glass-card dashboard collage, fabricated social proof, or decorative 3D object."
  constraints:
    - "Preserve the fixture repository's existing Next.js and React stack."
    - "Product proof must remain understandable without animation."
    - "Unapproved claims and assets must stay visibly pending."
  acceptance_criteria:
    - "The product's job and intended user are understandable in the first viewport."
    - "A visitor can inspect the demo narrative and reach the evaluation request with keyboard or touch."
    - "Pricing and proof slots distinguish confirmed facts from missing material."
    - "Mobile, reduced-motion, slow-network, and failed-media states preserve the primary path."

directions:
  - id: "editorial-instrument"
    concept: "Treat the product as a serious research instrument documented with editorial precision."
    consequences:
      composition: "Asymmetric reading grid with a stable evidence rail and long-form product annotations."
      typography: "Measured grotesk interface text paired with a restrained editorial serif for claims and findings."
      palette: "Warm paper neutral, ink, one analytic blue, and semantic evidence colors."
      assets: "Requires truthful product captures and small data diagrams; no atmospheric 3D."
      motion: "Level 1 feedback plus one optional Level 2 annotated product sequence."
      ambition_test: "Build the annotated product sequence at presentation fidelity and compare a static, Motion, and GSAP-assisted version in the browser before selecting the interaction model."
      fit: "Builds trust through legibility, provenance, and visible reasoning."
      sacrifice: "Feels less spectacular than an immersive launch and asks copy to carry real substance."
  - id: "living-model"
    concept: "Make the site feel like navigating a living map of sources, claims, and relationships."
    consequences:
      composition: "Dense spatial canvas with branching paths around a conventional narrative spine."
      typography: "Compact technical sans with labeled nodes and diagram-led hierarchy."
      palette: "Dark field, luminous relationship colors, and restrained translucent layers."
      assets: "Requires a robust relationship dataset and a purpose-built interactive visualization."
      motion: "Level 3 continuous canvas with a complete semantic list fallback."
      ambition_test: "Build a representative real-time relationship-map spike with actual sample density, mobile resolution scaling, and a semantic fallback before accepting or rejecting the spatial direction."
      fit: "Could embody the product's relationship-analysis idea when real data is available."
      sacrifice: "Risks making evaluation slower and trust weaker before the product and dataset are proven."

chosen_direction: "editorial-instrument"

research:
  mode: "reference-pass"
  source_route:
    - id: "lapa-ninja"
      source_type: "landing-page-gallery"
      role: "Compare product narrative, proof placement, pricing order, and conversion structure."
      coverage: "Matches AI product, editorial restraint, quiet minimalism, and microinteractions."
      gap: "Does not cover the requested product-demo component in the catalog match."
    - id: "godly"
      source_type: "curated-gallery"
      role: "Compare current AI product presentation and product-demo framing."
      coverage: "Matches AI product, quiet minimalism, product demo, and microinteractions."
      gap: "Does not cover the editorial axis in the catalog match."
    - id: "curated-design"
      source_type: "curated-gallery"
      role: "Add live-site contrast and reduce dependence on one gallery's selection taste."
      coverage: "Matches editorial and quiet-minimal styling, product demos, and microinteractions."
      gap: "Does not identify AI product scenario fit in the catalog match."
    - id: "elicit-homepage"
      source_type: "direct-product-site"
      role: "Review how a research workflow, product media, validation, and trust evidence form one narrative."
      coverage: "Public signed-out homepage observed through semantic DOM, computed styles, and asset evidence at 1280x720."
      gap: "Screenshot capture failed; authenticated product, submitted searches, and mobile states were not reviewed."
    - id: "consensus-homepage"
      source_type: "direct-product-site"
      role: "Review a research product that places the search task and controls before the marketing explanation."
      coverage: "Public signed-out page observed through semantic DOM, computed styles, active controls, and asset evidence at 1280x720."
      gap: "The load wait timed out after a usable DOM appeared; authenticated, submitted-search, and mobile states were not reviewed."
    - id: "scite-homepage"
      source_type: "direct-product-site"
      role: "Review how source-grounded positioning, evidence promises, and product illustrations establish trust."
      coverage: "Public signed-out homepage observed through semantic DOM, computed styles, and asset evidence at 1280x720."
      gap: "The single canvas was not attributed to a visible effect; authenticated, submitted-search, and mobile states were not reviewed."
  reference_matrix:
    - source_id: "lapa-ninja"
      principle: "Answer product questions in the order that skepticism arises."
      evidence_level: "source-claimed"
      evidence: "The catalog identifies this source as a landing-page and section-pattern collection; individual targets remain to be opened before visual claims."
      adaptation: "Order category explanation, annotated demonstration, proof, use cases, provisional pricing, and evaluation request as one reading path."
      do_not_copy: "Do not import a fashionable section sequence when no user question or proof supports it."
    - source_id: "godly"
      principle: "A product demonstration can be the visual identity instead of decorative futurism."
      evidence_level: "source-claimed"
      evidence: "The catalog routes this source for current product aesthetics and product-demo examples; exact examples still need direct visual review."
      adaptation: "Use a real interface capture with layered annotations as the main expressive media once an approved capture exists."
      do_not_copy: "Do not reproduce a listed site's signature composition, copy, gradients, or proprietary product media."
    - source_id: "curated-design"
      principle: "Triangulate the chosen direction against live contemporary sites."
      evidence_level: "source-claimed"
      evidence: "The catalog records the collection as linking to real live websites; technical behavior must still be audited directly."
      adaptation: "Select one quiet editorial counterexample before finalizing density, type contrast, and motion appetite."
      do_not_copy: "Do not infer business effectiveness, accessibility, or technology from gallery inclusion."
    - source_id: "elicit-homepage"
      principle: "A concrete research workflow can carry both category explanation and visual identity."
      evidence_level: "observed"
      evidence: "The opening leads into a controllable workflow video and meaningful product captures, then connects features to validation, cases, releases, and FAQ."
      adaptation: "Move an inspectable workflow, ordered explanation, and product evidence ahead of decorative atmosphere."
      do_not_copy: "Do not reuse its editorial type, palette combination, media, logos, claims, metrics, or section composition."
    - source_id: "consensus-homepage"
      principle: "For a search product, the task itself can be the primary hero and proof."
      evidence_level: "observed"
      evidence: "The signed-out page opens with an active research field, corpus and mode controls, filters, and example tasks before its longer explanation."
      adaptation: "Use a truthful constrained demo when the product can support one; otherwise label a non-submitting fixture explicitly."
      do_not_copy: "Do not reuse its application chrome, control arrangement, sample questions, typography, or corpus claims."
    - source_id: "scite-homepage"
      principle: "State what users can verify before expanding into a long feature story."
      evidence_level: "observed"
      evidence: "The research field is followed by a compact evidence layer, institutional proof, and product-specific feature illustrations."
      adaptation: "Place the evidence model beside the first output example and prove deeper claims with original diagrams or approved captures."
      do_not_copy: "Do not reuse its citation visual language, publisher logos, illustrations, coverage claims, or wording."

experience_contract:
  purpose: "Help research teams understand a complex AI workflow and request a serious evaluation."
  taste: "Choose editorial-instrument; reject generic futurism and spectacle without product evidence."
  content: "Lead with category clarity, then an inspectable demo, proof, use cases, provisional pricing, and evaluation request."
  constraints: "Preserve stack, rights, factual claims, semantic access, and usable no-motion/media-failure paths."
  research: "Use catalog routes to find the territory, then base visual implementation on the directly observed Elicit, Consensus, and Scite comparison while preserving evidence labels and non-copy boundaries."
  quality: "Release only when the primary path, responsive hierarchy, keyboard flow, reduced motion, and factual labeling pass."

content_path:
  - question: "What is this and is it meant for my team?"
    message: "A source-grounded AI workspace that helps research teams trace findings back to evidence."
    proof: "Plain workflow diagram; product capabilities remain labeled draft until verified."
    component: "Hero with category statement and evidence-flow diagram"
    action: "Inspect how it works"
  - question: "Can I see the actual workflow?"
    message: "Move from source collection to claim comparison and a reviewable synthesis."
    proof: "Approved product capture with step annotations; static storyboard until capture is available."
    component: "Annotated product demonstration"
    action: "Step through the demonstration"
  - question: "Why should I trust the output?"
    message: "Evidence visibility and human review are product principles, not a decorative claim."
    proof: "Only approved methodology notes and real provenance UI; no invented metrics or logos."
    component: "Trust and methodology section"
    action: "Read the evidence model"
  - question: "Is it appropriate for our workflow?"
    message: "Show fit by research job rather than generic industry tiles."
    proof: "Scenario descriptions marked draft until validated with users."
    component: "Use-case comparison"
    action: "Identify a relevant workflow"
  - question: "What does evaluation cost?"
    message: "Expose plan shape and unresolved commercial details honestly."
    proof: "Confirmed inclusions only; numerical prices remain pending."
    component: "Provisional pricing and evaluation request"
    action: "Request an evaluation workspace"

design_system:
  typography: "Fluid display 48–88px, body 17–20px, 65ch reading measure, tabular numerals for evidence metadata."
  layout: "Twelve-column desktop grid; evidence rail collapses below its related claim on mobile."
  spacing: "8px base with deliberate 24/40/64/104px section rhythm."
  color: "Warm neutral background, near-black text, analytic blue action, and accessible semantic states verified against final tokens."
  media: "Product media uses consistent 16:10 frames, legible crops, descriptive alternatives, and static posters."
  interaction: "Visible focus, 44px touch targets, explicit disclosure states, no custom cursor or scroll hijacking."
  motion: "180ms feedback, 420–650ms explanatory transitions, one easing family, interruption-safe behavior."

components:
  - id: "site-navigation"
    semantic_role: "Orient the visitor and expose the evaluation request without hiding the reading path."
    responsive: "Desktop inline links become a labeled disclosure; primary action remains visible."
    states: ["default", "hover", "focus", "open", "current"]
    inputs: ["pointer", "keyboard", "touch"]
    motion: "Short opacity and transform feedback that never controls reachability."
    reduced_motion: "Immediate state change without transform."
    fallback: "Semantic links remain present and ordered when JavaScript fails."
  - id: "annotated-product-demo"
    semantic_role: "Explain one truthful workflow with media, captions, and ordered steps."
    responsive: "Pinned desktop annotations become a linear figure-and-caption sequence on narrow screens."
    states: ["loading", "default", "focus", "active", "media-error"]
    inputs: ["scroll", "pointer", "keyboard", "touch"]
    motion: "Optional coordinated step transitions tied to explicit current-step state."
    reduced_motion: "All steps render as a static ordered storyboard."
    fallback: "Poster images, captions, and transcript preserve the full explanation."
  - id: "evaluation-form"
    semantic_role: "Collect only the information needed to qualify an evaluation request."
    responsive: "Single readable column on mobile; related fields may share a desktop row."
    states: ["default", "hover", "focus", "invalid", "submitting", "success", "error", "disabled"]
    inputs: ["keyboard", "pointer", "touch"]
    motion: "Local state feedback only; success does not depend on animation."
    reduced_motion: "No spatial transitions; focus moves to the status message."
    fallback: "Server-compatible labels, validation, status text, and a contact alternative."

enhancement:
  level: 2
  purpose: "Make the product workflow easier to understand by connecting each claim to the matching interface evidence."
  essential: "Ordered captions, screenshots, and evaluation link."
  decorative: "Section reveals and subtle evidence-line drawing."
  loading: "Critical opening copy is server-rendered; demo media is deferred and reserves aspect ratio."
  reduced_motion: "Render the complete storyboard with no pinning, scrubbed motion, or sequential reveal."
  fallback: "Linear semantic figures and captions work without JavaScript or enhanced media."
  verification_plan: "Compare the static storyboard, native scroll-state version, and one coordinated-motion spike through screenshots, keyboard use, reduced motion, mobile runtime, and content comprehension before choosing."

assets:
  - id: "product-capture-sequence"
    role: "Primary proof for the annotated demonstration."
    origin: "actual-product-capture"
    provenance: "Must be captured from an approved product build and linked to the build state; the current wireframe is not product evidence."
    rights: "pending"
    license_attribution: "Pending confirmation that the product team owns the interface and capture rights; attribution is otherwise not required."
    status: "placeholder"
    replacement_brief: "Replace with approved 16:10 product captures showing source collection, comparison, and human review; preserve the annotated focal zones and mobile crops. Owner: product team."
    release_blocking: true
    format: "Responsive AVIF/WebP stills after product approval."
    loading: "First poster eager only when visible; remaining steps deferred."
    fallback: "Polished fictional storyboard with clearly labeled sample data and the same responsive visual mass as the final capture."
  - id: "brand-font"
    role: "Interface and editorial voice."
    origin: "licensed-font"
    provenance: "Exact foundry, font files, web-use entitlement, and subset permission remain to be recorded."
    rights: "pending"
    license_attribution: "Pending license review; replace with system fallbacks if web embedding is not permitted."
    status: "pending"
    replacement_brief: "Confirm the editorial and interface font families, webfont formats, weights, subset rights, and metric-compatible fallbacks. Owner: brand lead."
    release_blocking: true
    format: "Self-hosted WOFF2 subsets if licensed."
    loading: "Preload only the primary roman subset."
    fallback: "System sans and Georgia-based editorial fallback with adjusted metrics."
  - id: "evidence-flow-diagram"
    role: "Explain source-to-claim provenance in the opening section."
    origin: "generated-original"
    provenance: "Original semantic SVG authored for this fictional fixture from its verified content model; no reference-site artwork is reused."
    rights: "generated"
    license_attribution: "Not required for the original fixture SVG; preserve authorship provenance in the project."
    status: "approved"
    replacement_brief: "No replacement required; revise only when verified product terminology or workflow order changes. Owner: product design."
    release_blocking: false
    format: "Original semantic SVG authored for this fixture."
    loading: "Inline after heading content."
    fallback: "Ordered text list conveys the same sequence."

dependencies:
  - name: "existing-motion-library"
    behavior: "Coordinates the optional annotated demo steps if the fixture repository already includes it."
    rationale: "Use only when installed and when native scroll/state primitives cannot keep annotations synchronized cleanly."
    bundle_runtime: "No new package by default; measure the existing client boundary before reuse."
    ssr_hydration: "Opening content stays server-rendered; hydrate only the demo controller."
    cleanup: "Remove observers and animation handles on route exit."
    reduced_motion: "Do not initialize the coordinated sequence when reduced motion is requested."
    license: "Confirm the installed package and license before implementation."

verification:
  viewports: ["1440x900", "1024x768", "390x844", "320x568"]
  scenarios: ["primary-path", "keyboard", "reduced-motion", "slow-network", "media-failure"]
  tested:
    - "Chromium at 1440x900, 390x844, and 320x568: semantic landmarks, fragment targets, navigation, tabs, keyboard state, form validation, and horizontal overflow."
    - "Chromium at 1024x768 with reduced motion: media query matched, animation duration reduced to at most one millisecond, and smooth scrolling disabled."
    - "Chromium at 390x844 with JavaScript disabled: primary navigation and all three workflow panels remained visible."
    - "Desktop and mobile full-page screenshots were visually inspected for hierarchy, composition, type, responsive behavior, and fallback coherence."
    - "Axe 4.12.1 WCAG A/AA scans at 1440x900 and 390x844: zero violation groups."
    - "Chromium accessibility tree: all exposed interactive controls named; unique banner, main, and contentinfo landmarks; three named tabs."
    - "Fixture resource budget: three same-origin requests, 33,212 local source bytes, 22,356 transfer bytes, 188 DOM nodes, CLS 0, and zero long tasks."
    - "Pinned Lighthouse 13.4.1 mobile lab run: performance 100%, accessibility 100%, best practices 100%, FCP 0.9s, LCP 0.9s, TBT 0ms, CLS 0, and approximately 33KiB total transfer."
    - "Direct public-page reference pass at 1280x720: Elicit, Consensus, and Scite were compared through semantic DOM, computed styles, interactive controls, and page-asset evidence."
  release_gates:
    - "No fabricated product, price, customer, metric, or testimonial claim."
    - "Navigation, demo content, form, and primary action remain reachable by keyboard."
    - "Narrow mobile has no blocking overflow or hidden proof."
    - "Reduced-motion and failed-media paths preserve all essential meaning."
    - "Every shipped asset has known rights and a fallback."
    - "No placeholder or pending asset marked release-blocking remains in a production delivery."
  untested:
    - "Manual screen-reader walkthrough and real-device assistive-technology behavior remain pending; automated results do not replace them."
    - "Backend submission, real product media, production framework integration, representative content extremes, and field performance are outside this static fixture."
    - "Authenticated product flows, submitted searches, and mobile or assistive-technology behavior on the three direct reference sites remain untested."

known_gaps:
  - "Final copy, product capture, claims, prices, customer proof, type license, and asset rights are unresolved."
  - "The attached vertical slice is a static browser fixture, not a production repository or connected product."
next_improvement: "Obtain one approved product capture, replace the fixture storyboard with truthful product evidence, and repeat the same gates in the production repository."
